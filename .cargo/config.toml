[build]
# Uncomment for CUDA support on Linux
# rustflags = ["-C", "link-arg=-L/usr/local/cuda/lib64"]

[target.x86_64-unknown-linux-gnu]
# rustflags = ["-C", "link-arg=-L/usr/local/cuda/lib64"]

[target.aarch64-apple-darwin]
