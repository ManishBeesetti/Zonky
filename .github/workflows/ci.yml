name: CI

on:
  push:
    branches: [main, develop, "codex/**"]
  pull_request:
    branches: [main, develop]

jobs:
  rust:
    name: Rust Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev cmake clang

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Build and test (no-default-features / Candle)
        run: cargo test -p zonky-core -p zonky-server -p zonky-tui -p zonky-cli --no-default-features

      - name: Build and test workspace (default features)
        run: cargo test --workspace

  frontend:
    name: Frontend Build & E2E Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/zonky-ui/frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: crates/zonky-ui/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        run: npm test
